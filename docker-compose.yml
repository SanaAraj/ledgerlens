services:
  api:
    build:
      context: ./apps/api
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-10000}
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8100:8080"
    depends_on:
      - api
    restart: unless-stopped
